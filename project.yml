# XcodeGen manifest for JARVIS.
#
# Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# or run Scripts/bootstrap.sh, which does both steps.
#
# The project is generated rather than committed so that file moves never
# leave a stale pbxproj behind.

name: Jarvis

options:
  bundleIdPrefix: com.jarvis
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    CLANG_ENABLE_OBJC_ARC: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  Jarvis:
    type: application
    platform: macOS
    sources:
      - path: Jarvis
        excludes:
          - "Support/Info.plist"
          - "Support/Jarvis.entitlements"
    settings:
      base:
        PRODUCT_NAME: JARVIS
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.desktop
        INFOPLIST_FILE: Jarvis/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Jarvis/Support/Jarvis.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets: []
      gatherCoverageData: false
      environmentVariables:
        OS_ACTIVITY_MODE: default

schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
    run:
      config: Debug
    archive:
      config: Release
